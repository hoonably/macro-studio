<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내부 사이트 허용 · Macro Studio</title><link rel="stylesheet" href="frame-permissions.css"></head>
<body><main>
  <header><img src="../assets/icon-32.png" width="28" height="28" alt=""><span>Macro Studio</span></header>
  <h1>새 내부 사이트를<br>허용해주세요</h1>
  <p id="description">기록을 잠시 멈췄어요. 아래 주소를 허용하면 기존 기록에 이어서 계속할 수 있어요.</p>
  <ul id="origins" aria-label="허용할 내부 사이트"></ul>
  <p id="status" role="status" aria-live="polite">새 내부 사이트를 확인하고 있어요…</p>
  <div class="actions"><button id="grant" disabled autofocus>허용하고 기록 계속</button>
    <button id="stop" class="secondary" disabled>기록 끝내기</button></div>
  <p class="hint">허용 전에 진행한 작업은 기록되지 않아요. 승인 후 해당 화면의 작업을 이어가세요.</p>
</main><script type="module" src="frame-permissions.js"></script></body></html>
