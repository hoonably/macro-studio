<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Macro Studio · 입력 예제</title><link rel="stylesheet" href="studio.css"></head>
<body><main><section class="intro"><span class="eyebrow">MACRO STUDIO · PLAYGROUND</span><h1>첫 매크로를 실행해 보세요.</h1><p>오른쪽 아래 파란 아이콘 → ‘폼 입력 예제’를 선택하면 이 페이지의 입력란을 채웁니다.</p></section>
<section><h2>방문 신청 예제</h2><form id="demo-form"><label>방문일<input name="visitDate" type="date"></label><label>방문 기관<input name="organization"></label><label>목적<textarea name="purpose" rows="3"></textarea></label><p class="hint">연습용 페이지입니다. 서버 전송이나 실제 신청은 없습니다.</p><output id="demo-result" role="status"></output></form></section>
<section><h2>나만의 작업으로 바꾸기</h2><p>사이드패널에서 웹 작업을 기록한 뒤, 저장소를 연 코딩 에이전트에 프롬프트를 전달하세요.</p><a href="https://github.com/hoonably/macro-studio/blob/main/docs/create-script.md" target="_blank" rel="noreferrer">개인 스크립트 만들기 ↗</a></section></main>
<script src="../core/namespace.js"></script><script src="../adapters/dom.js"></script><script src="launcher.js"></script><script src="../scripts/examples/form-fill/script.js"></script>
</body></html>
