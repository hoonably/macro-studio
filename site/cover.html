<section class="product-cover macro-cover" aria-labelledby="macro-cover-title">
  <div class="container">
    <div class="macro-intro">
      <h1 id="macro-cover-title">반복하는 웹 작업을<br><em>매크로로 만드세요.</em></h1>
      <div class="macro-intro__aside">
        <p>클릭과 입력 순서를 기록해 Codex·Claude Code에 건네세요. 함께 만든 매크로는 쓰던 사이트에서 버튼 하나로 실행해요.</p>
        $actions
        $platform
      </div>
    </div>

    <section class="macro-demo" data-macro-demo aria-labelledby="macro-demo-title">
      <div class="macro-demo__heading">
        <h2 id="macro-demo-title">출장 신청</h2>
        <p class="macro-demo__note">출장지와 날짜를 고르고 실행해 보세요.</p>
      </div>
      <div class="macro-tape">
        <ol class="macro-tape__steps" aria-label="매크로 실행 순서">
          <li>
            <span class="macro-tape__kind"><b>01</b> 열기</span>
            <span class="macro-tape__value">새 신청서</span>
          </li>
          <li>
            <label class="macro-tape__kind" for="macro-destination"><b>02</b> 출장지</label>
            <span class="macro-tape__select">
              <select id="macro-destination" disabled>
                <option data-purpose="학회 참석">부산</option>
                <option data-purpose="공동 연구 회의">대전</option>
                <option data-purpose="워크숍 참석">서울</option>
              </select>
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </span>
          </li>
          <li>
            <label class="macro-tape__kind" for="macro-date"><b>03</b> 출장일</label>
            <span class="macro-tape__value"><input type="date" id="macro-date" required disabled></span>
          </li>
        </ol>
        <button class="macro-tape__run" type="button" data-run hidden>
          <svg viewBox="0 0 22 22" aria-hidden="true"><path d="m7 4 10 7-10 7z"/></svg><span>매크로 실행</span>
        </button>
      </div>

      <section class="trip-sheet" aria-labelledby="trip-sheet-title">
        <div class="trip-sheet__head">
          <h3 id="trip-sheet-title">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h6"/></svg>
            국내 출장 신청서
          </h3>
          <p class="trip-sheet__status" role="status" data-status>작성 전</p>
        </div>
        <dl class="trip-sheet__fields">
          <div><dt>출장지</dt><dd data-field="destination">—</dd></div>
          <div><dt>출장 일정</dt><dd data-field="date">—</dd></div>
          <div><dt>출장 목적</dt><dd data-field="purpose">—</dd></div>
        </dl>
      </section>
      <noscript><p class="macro-demo__note">신청서 작성을 재생하려면 자바스크립트를 켜 주세요.</p></noscript>
    </section>
  </div>
</section>
